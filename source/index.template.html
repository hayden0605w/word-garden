const seed=[['bird','鳥','🐦'],['river','河流','🏞️'],['bush','灌木叢','🌿'],['ocean','海洋','🌊'],['star','星星','⭐'],['grass','草','🌱'],['flower','花','🌸'],['butterfly','蝴蝶','🦋'],['mountain','山','⛰️'],['rock','石頭','🪨'],['sun','太陽','☀️'],['tree','樹','🌳'],['moon','月亮','🌙'],['cloud','雲','☁️'],['sky','天空','🌤️']];
let db;try{db=JSON.parse(localStorage.getItem('wordgarden-v1'))}catch{}if(!db||!Array.isArray(db.cards))db={cards:seed.map((x,i)=>({id:(Date.now().toString(36)+Math.random().toString(36).slice(2)),word:x[0],zh:x[1],emoji:x[2],due:0,interval:0,reps:0})),history:{}};db.history ||= {};let page='home',queue=[],current=null,checked=false,revealed=false,done=0,total=0,editId=null;const app=document.getElementById('app');const day=()=>new Date().toLocaleDateString('en-CA');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){return persistLearning()}function due(){return db.cards.filter(c=>c.due<=Date.now())}function art(c){return c.image?`<img src="${esc(c.image)}" alt="${esc(c.zh)}" onerror="this.replaceWith(document.createTextNode('🌱'))">`:esc(c.emoji||'🌱')}const pronunciationCache=new Map();let playingAudio=null,speechRequest=0;
let audioStatusTimer=null;
function clearAudioStatus(){clearTimeout(audioStatusTimer);audioStatusTimer=null;document.getElementById('audio-status')?.remove()}
function audioStatus(message,duration=4500){clearAudioStatus();const box=document.createElement('div');box.id='audio-status';box.setAttribute('role','status');box.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;background:#fffdf6;border:1px solid #d8e0cd;border-radius:16px;padding:12px 18px;max-width:90%;font-size:13px;box-shadow:0 4px 20px #263b2e15';box.textContent=message;document.body.appendChild(box);if(duration>0)audioStatusTimer=setTimeout(clearAudioStatus,duration)}
function stopPronunciation(){speechRequest++;if(playingAudio){playingAudio.pause();playingAudio=null}if('speechSynthesis'in window)speechSynthesis.cancel();clearAudioStatus()}
function safeHttps(value){try{let url=new URL(value.startsWith('//')?'https:'+value:value);return url.protocol==='https:'?url.href:null}catch{return null}}
let staticPronunciations=null;async function lookupAudio(word){const key=word.toLowerCase();if(pronunciationCache.has(key))return pronunciationCache.get(key);if(!staticPronunciations){const response=await fetch(new URL('assets/pronunciations.json',document.baseURI));if(!response.ok)throw Error('audio unavailable');staticPronunciations=await response.json()}const record=staticPronunciations[key];if(!record)throw Error('no recording');const clips=[{...record,url:new URL(record.url,document.baseURI).href}];pronunciationCache.set(key,clips);return clips}
function fallbackSpeech(word,slow,request,reason='connection'){if(request!==speechRequest)return;audioStatus(reason==='no recording'?'字典未提供這個字的音檔，改用裝置語音。':reason==='NotAllowedError'?'瀏覽器阻擋播放，請再按一次發音。':'字典連線或音檔播放失敗，改用裝置語音。');if(!('speechSynthesis'in window)){audioStatus('此單字暫時無法發音，請稍後重試。');return}let u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=slow?.55:.8;let voice=speechSynthesis.getVoices().find(v=>v.lang==='en-US');if(voice)u.voice=voice;u.onend=u.onerror=()=>{if(request===speechRequest)clearAudioStatus()};speechSynthesis.speak(u)}
async function speak(word,slow=false){stopPronunciation();const request=++speechRequest;audioStatus('正在載入已保存的發音…',0);try{const clips=await lookupAudio(word);let lastError;for(const entry of clips){if(request!==speechRequest)return;const audio=new Audio(entry.url);playingAudio=audio;audio.playbackRate=slow?.75:1;audio.preservesPitch=true;const finish=()=>{if(request===speechRequest){if(playingAudio===audio)playingAudio=null;clearAudioStatus()}};audio.onended=finish;audio.onpause=finish;try{await new Promise((resolve,reject)=>{let timer=setTimeout(()=>{audio.pause();reject(Error('audio timeout'))},20000);audio.onplaying=()=>{clearTimeout(timer);resolve()};audio.onerror=()=>{clearTimeout(timer);finish();reject(Error('audio failed'))};audio.play().catch(e=>{clearTimeout(timer);reject(e)})});if(request!==speechRequest){audio.pause();return}audioStatus('🔊 播放中',0);return}catch(error){audio.pause();lastError=error;if(error.name==='NotAllowedError')break}}throw lastError||Error('no recording')}catch(error){console.warn('Dictionary pronunciation:',error.name,error.message);fallbackSpeech(word,slow,request,error.name==='NotAllowedError'?error.name:error.message)}}
let navigationId=0;async function go(p){const request=++navigationId;stopPronunciation();page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='study'){let synced=true;if(gistConfig){app.innerHTML='<div class="practice panel empty" role="status">☁ 正在同步最新字卡與進度…</div>';try{synced=await syncBeforeStudy()}catch{synced=false}}if(request!==navigationId||page!=='study')return;start();if(!synced)app.insertAdjacentHTML('afterbegin','<p role="status" style="text-align:center">⚠ 暫時無法完成同步，這回使用本機字卡；進度會保留並稍後重試。</p>');return}render()}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
function render(){if(page==='home'){let n=due().length,learned=db.cards.filter(c=>c.reps>0).length,today=db.history[day()]||0;app.innerHTML=`<section class="welcome"><div><div class="eyebrow">GROW A LITTLE EVERY DAY</div><h1>嗨，小小單字探險家！</h1><p>聽一聽、拼一拼，讓記憶慢慢發芽。</p></div><div class="date">☀️ ${new Date().toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'long'})}</div></section><div class="layout"><div><section class="panel hero"><span class="tag">🌱 ${studyLimit()==='all'?'完成所有到期字卡':'每回合 '+studyLimit()+' 張字卡'}</span><h2>${n?'今天也來種下<br>一點新記憶吧。':'太棒了，花園照顧好了！'}</h2><p>${n?`有 ${n} 張字卡等你探索。<br>先複習快忘記的，再認識新朋友。`:'今天的複習完成了，也可以自由練習。'}</p>${studyLimitControl()}<br><br><button class="primary" onclick="go('study')">${n?'開始今日練習':'再練習一回'}　→</button><div class="art">🪴</div></section><div class="stats"><div class="stat"><b>${n}<small style="font-size:13px"> 張</small></b><span>等待複習</span></div><div class="stat"><b>${today}<small style="font-size:13px"> 次</small></b><span>今日練習</span></div><div class="stat"><b>${learned}<small style="font-size:13px"> 個</small></b><span>已探索單字</span></div></div><h2>我的單字收藏 <small style="font-size:12px;color:#879080">　持續長大的知識花園</small></h2><div class="collection"><div class="tile">🏕️</div><div><strong>我的學習字卡</strong><p>從內建字庫挑選，累積自己的單字花園</p><span class="tag">${db.cards.length} 張字卡</span></div><button onclick="go('cards')">打開收藏 →</button></div></div><aside class="panel side"><span class="eyebrow">MY LITTLE GARDEN</span><h3>每一次練習，都在長大</h3><div class="plant">${learned>10?'🌳':learned>3?'🪴':'🌱'}</div><div class="days">${Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return `<span class="${db.history[d.toLocaleDateString('en-CA')]?'yes':''}">${['日','一','二','三','四','五','六'][d.getDay()]}</span>`}).join('')}</div><p class="note">不用一次記住全部。<br>在快忘記的時候再見面，會記得更久喔！</p><div class="hint">💡 給家長的小提醒<br>先讓孩子聽發音，再試著拼字。答錯的單字會更快回來練習。</div></aside></div>`}else if(page==='cards')renderCards();else if(page==='catalog')renderCatalog()}
function studyLimit(){try{const value=localStorage.getItem('wordgarden-round-size');return ['5','10','all'].includes(value)?value:'10'}catch{return '10'}}function setStudyLimit(value){if(!['5','10','all'].includes(value))return;try{localStorage.setItem('wordgarden-round-size',value)}catch{}if(page==='home')render()}function studyLimitControl(){const value=studyLimit();return `<label for="round-size">每回合字卡數</label><select id="round-size" onchange="setStudyLimit(this.value)"><option value="5" ${value==='5'?'selected':''}>5 張</option><option value="10" ${value==='10'?'selected':''}>10 張</option><option value="all" ${value==='all'?'selected':''}>全部到期字卡</option></select>`}
function start(){const setting=studyLimit(),limit=setting==='all'?Infinity:Number(setting);queue=due().sort((a,b)=>(a.reps===0)-(b.reps===0)||a.due-b.due).slice(0,limit).map(c=>c.id);if(!queue.length&&setting!=='all')queue=[...db.cards].sort(()=>Math.random()-.5).slice(0,limit).map(c=>c.id);done=0;total=queue.length;next()}function next(){stopPronunciation();checked=false;revealed=false;let nextId=queue.shift();current=db.cards.find(c=>c.id===nextId);if(!current){app.innerHTML=`<div class="practice panel empty"><div style="font-size:90px">🌻</div><h1>${total?'你讓花園長大了一點！':db.cards.length?'目前沒有到期字卡！':'先種下第一張字卡吧！'}</h1><p>${total?`這回完成 ${done} 次練習。下一次複習時間已經排好了。`:db.cards.length?'到期字卡已完成，之後再回來複習吧。':'新增單字後，就可以開始練習。'}</p><button class="primary" onclick="go('home')">回到花園</button> <button onclick="go('cards')">看看字卡</button></div>`;return}practice()}
function builtInKeyboard(){try{const preference=localStorage.getItem('wordgarden-keyboard');if(preference)return preference==='built-in'}catch{}return navigator.maxTouchPoints>0||matchMedia('(pointer: coarse)').matches}
function keyboardMarkup(){return `<div id="garden-keyboard" class="garden-keyboard" aria-label="英文鍵盤" ${builtInKeyboard()?'':'hidden'}>${['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'].map(row=>`<div class="key-row">${[...row].map(letter=>`<button type="button" data-key="${letter.toLowerCase()}" aria-label="字母 ${letter}">${letter}</button>`).join('')}</div>`).join('')}<div class="key-row"><button type="button" class="wide-key" data-key="'">撇號 '</button><button type="button" data-key="-">-</button><button type="button" data-key=".">.</button><button type="button" class="wide-key" data-key=" ">空格</button><button type="button" class="wide-key" data-key="backspace" aria-label="刪除一個字母">⌫ 刪除</button><button type="button" class="wide-key primary" data-key="enter">送出 ✓</button></div></div>`}
function focusAnswer(){const input=document.getElementById('answer');if(input&&!checked)input.focus({preventScroll:true})}
function enterGardenKey(key){const input=document.getElementById('answer');if(!input||checked||input.disabled)return;if(key==='enter'){check();return}const start=input.selectionStart??input.value.length,end=input.selectionEnd??start;if(key==='backspace'){input.setRangeText('',start===end?Math.max(0,start-1):start,end,'end')}else if(input.value.length<60){input.setRangeText(key,start,end,'end')}focusAnswer()}
function setKeyboardMode(){const useBuiltIn=!builtInKeyboard();try{localStorage.setItem('wordgarden-keyboard',useBuiltIn?'built-in':'system')}catch{}applyKeyboardMode(useBuiltIn);if(useBuiltIn)document.getElementById('answer').blur();else focusAnswer()}
function applyKeyboardMode(useBuiltIn=builtInKeyboard()){const input=document.getElementById('answer');input.readOnly=useBuiltIn;input.inputMode=useBuiltIn?'none':'text';document.getElementById('garden-keyboard').hidden=!useBuiltIn;document.getElementById('keyboard-mode').textContent=useBuiltIn?'使用系統鍵盤':'使用內建鍵盤';document.getElementById('keyboard-label').textContent=useBuiltIn?'完整英文鍵盤':'系統／實體鍵盤'}
function practice(){app.innerHTML=`<div class="practice practice-session"><div class="row" style="justify-content:space-between"><button onclick="go('home')">← 回花園</button><span>本回合 ${done+1} / ${total}</span></div><div class="progress"><i style="width:${done/total*100}%"></i></div><section class="panel study-grid"><div class="study-prompt"><span class="eyebrow">LISTEN · THINK · SPELL</span><h2>這個單字怎麼拼？</h2><button type="button" class="picture pronounce-target" onclick="speak(current.word)" aria-label="點圖片聽單字發音">${art(current)}</button><button type="button" class="meaning pronounce-target" onclick="speak(current.word)" aria-label="點中文聽單字發音">${zhText(current.zh)}</button><div class="row"><button type="button" class="listen-button" onclick="speak(current.word)">🔊 聽發音</button></div></div><form id="answerform" class="study-entry"><div class="study-controls"><span id="keyboard-label"></span><button type="button" id="keyboard-mode" class="keyboard-mode" onclick="setKeyboardMode()"></button></div><input id="answer" class="spell" aria-label="輸入英文單字" maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在這裡拼字"><div id="letters" class="letters"></div><div id="feedback" aria-live="polite"></div><div id="actions" class="row"><button type="button" onclick="hint()">💡 看提示</button><button class="primary">檢查答案 ✓</button></div>${keyboardMarkup()}</form></section><p class="study-instruction">先試著自己拼字，需要幫忙時按「看提示」。也可以直接用實體鍵盤輸入。</p></div>`;document.getElementById('answerform').onsubmit=e=>{e.preventDefault();check()};document.querySelectorAll('[data-key]').forEach(button=>{button.onpointerdown=e=>e.preventDefault();button.onclick=()=>enterGardenKey(button.dataset.key)});applyKeyboardMode();focusAnswer()}
document.addEventListener('keydown',event=>{if(page!=='study'||!builtInKeyboard()||checked||event.ctrlKey||event.metaKey||event.altKey||event.isComposing||document.querySelector('dialog[open]'))return;const input=document.getElementById('answer');if(!input||event.target!==input)return;const key=event.key;if(/^[a-zA-Z .'-]$/.test(key)||key==='Backspace'||key==='Enter'){event.preventDefault();enterGardenKey(key==='Backspace'?'backspace':key==='Enter'?'enter':key.toLowerCase())}});
function showLetterHints(){let letters=[...new Set(current.word.split(''))].sort(()=>Math.random()-.5);document.getElementById('letters').innerHTML=letters.map(l=>`<button type="button" data-letter="${esc(l)}">${esc(l===' '?'␣':l)}</button>`).join('');document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{document.getElementById('answer').value+=b.dataset.letter;focusAnswer()})}function hint(){if(checked)return;if(!revealed){revealed=true;showLetterHints()}document.getElementById('feedback').innerHTML=`<div class="feedback">第一個字母是 <b>${esc(current.word[0])}</b>，共有 ${current.word.replace(/ /g,'').length} 個字母。<br>試著聽一次，再拼拼看！</div>`}function check(){if(checked)return;let val=document.getElementById('answer').value.trim().toLowerCase();if(!val)return;checked=true;document.querySelectorAll('[data-key]').forEach(button=>button.disabled=true);document.getElementById('keyboard-mode').disabled=true;let right=val===current.word.toLowerCase();document.getElementById('answer').disabled=true;document.getElementById('letters').innerHTML='';document.getElementById('feedback').innerHTML=`<div class="feedback">${right?'<span class="answer-mascot" aria-hidden="true">🐰🌟</span> 拼對了，做得好！':'🌱 沒關係，再看一次就更熟悉。'}<br><button type="button" class="answer-word" onclick="speak(current.word)" aria-label="再聽一次單字發音">${esc(current.word)}</button><br>${zhText(current.zh)}</div>`;document.getElementById('actions').innerHTML=right?`<button type="button" onclick="rate(1)">有點難</button><button type="button" class="primary" onclick="rate(${revealed?1:2})">${revealed?'提示後想起來了':'我記住了！'} →</button>`:`<button type="button" onclick="speak(current.word)">🔊 再聽一次</button><button type="button" class="primary" onclick="rate(0)">等一下再練一次 →</button>`;speak(current.word)}
function rate(grade){if(!checked)return;if(!db.cards.some(c=>c.id===current.id)){audioStatus('這張卡已在另一個裝置刪除。');next();return}checked=false;let mins=60000;if(grade===0){current.interval=0;current.due=Date.now()+10*mins;if(queue.length<8){queue.push(current.id);total++}}else{current.reps++;current.interval=grade===1?1:current.interval?Math.max(3,Math.round(current.interval*2.3)):1;current.due=Date.now()+current.interval*86400000}db.history[day()]=(db.history[day()]||0)+1;save();done++;next()}
function renderCards(q=''){app.innerHTML=`<div class="eyebrow">YOUR WORD COLLECTION</div><h1>字卡收藏</h1><p>每個新單字，都是一顆小種子。可以持續新增，也可以備份帶走。</p><div class="toolbar"><input id="search" placeholder="搜尋英文或中文" aria-label="搜尋字卡" value="${esc(q)}"><button class="primary" onclick="go('catalog')">📚 從內建字庫加入</button><button onclick="openEditor()">＋ 自訂字卡</button><button onclick="backup()">匯出備份</button><button onclick="document.getElementById('importer').click()">匯入備份</button></div><p style="font-size:12px">複習安排：不熟 → 10 分鐘；有點難 → 1 天；記住了 → 1 天、3 天、約 7 天，之後逐步拉長。答錯會在本回合再練。</p><div id="cardlist" class="cards"></div>`;document.getElementById('search').oninput=e=>list(e.target.value);list(q)}function list(q){let cards=db.cards.filter(c=>(c.word+c.zh).toLowerCase().includes(q.toLowerCase()));document.getElementById('cardlist').innerHTML=cards.length?cards.map(c=>`<div class="panel mini"><div class="icon">${art(c)}</div><strong>${esc(c.word)}</strong><p>${zhText(c.zh)}</p><small>${!c.reps?'新朋友':c.due<=Date.now()?'可以複習了':`下次：${new Date(c.due).toLocaleDateString('zh-TW')}`}</small><div style="margin-top:12px"><button data-speak="${c.id}">🔊 發音</button><button data-edit="${c.id}">編輯</button><button data-delete="${c.id}" aria-label="刪除 ${esc(c.word)}">×</button></div></div>`).join(''):'<p>還找不到這個單字，新增一張吧！</p>';document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(db.cards.find(c=>c.id===b.dataset.speak).word));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('確定刪除這張字卡和它的學習進度？')){db.cards=db.cards.filter(c=>c.id!==b.dataset.delete);save();list(q)}})}
function openEditor(id){editId=id||null;let c=db.cards.find(c=>c.id===id);document.getElementById('cardform').reset();for(let k of ['word','zh','emoji','image'])document.getElementById(k).value=c?.[k]||(k==='emoji'?'🌱':'');document.getElementById('dialogtitle').textContent=c?'編輯單字':'種下一個新單字 🌱';document.getElementById('formerror').textContent='';document.getElementById('word-suggestions').replaceChildren();updateMeaningPreview();document.getElementById('editor').showModal();loadCatalog().catch(()=>{})}
document.getElementById('cardform').onsubmit=async e=>{e.preventDefault();let word=document.getElementById('word').value.trim(),zh=document.getElementById('zh').value.trim(),emoji=document.getElementById('emoji').value.trim(),image=document.getElementById('image').value.trim(),file=document.getElementById('photo').files[0];if(!word||!zh)return;if(!validWord(word)){document.getElementById('formerror').textContent='請使用英文字母、空格、句點、撇號或連字號。';return}if(db.cards.some(c=>c.word===word&&c.id!==editId)){document.getElementById('formerror').textContent='這個單字已經在花園裡囉！';return}if(image&&!image.startsWith('https://')){document.getElementById('formerror').textContent='圖片請使用 https 網址。';return}if(file){if(file.size>1048576){document.getElementById('formerror').textContent='請選擇小於 1 MB 的圖片。';return}image=await new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)})}let c=db.cards.find(c=>c.id===editId);if(c){Object.assign(c,{word,zh,emoji,image})}else db.cards.push({id:(Date.now().toString(36)+Math.random().toString(36).slice(2)),word,zh,emoji,image,due:0,interval:0,reps:0});if(save()){document.getElementById('editor').close();page='cards';renderCards();prepareRecording(word)}};
async function prepareRecording(word){audioStatus('字卡已儲存，正在確認內建錄音…');try{await lookupAudio(word);audioStatus('✓ 已帶入內建錄音。')}catch{audioStatus('字卡已儲存；這個字沒有內建錄音，會使用裝置語音。')}}

let catalogData=null,catalogPromise=null,catalogPage=0,catalogQuery='',catalogCategory='';
function validWord(word){return /^[A-Za-z][A-Za-z .'-]{0,59}$/.test(word)}
async function loadCatalog(){if(catalogData)return catalogData;if(!catalogPromise)catalogPromise=fetch(new URL('assets/catalog.json',document.baseURI)).then(r=>{if(!r.ok)throw Error('字庫暫時無法載入');return r.json()}).then(data=>catalogData=data).catch(e=>{catalogPromise=null;throw e});return catalogPromise}
async function renderCatalog(){app.innerHTML='<div class="panel"><h1>📚 內建單字圖書館</h1><p role="status">正在打開字庫…</p></div>';try{const data=await loadCatalog();if(page!=='catalog')return;const categories=[...new Set(data.words.map(x=>x.category))];app.innerHTML=`<div class="eyebrow">PICK A WORD · PLANT A MEMORY</div><h1>內建單字圖書館</h1><p>教育部基本 1,200 字 · 原表共 ${data.words.length.toLocaleString()} 筆條目<br>每個字已備好中文與圖示，選喜歡的加入自己的練習。</p><div class="panel" style="padding:18px;background:#eaf0dd;font-size:13px">🌱 一次選幾個就好，加入後才會排入複習。<br>圖示是概念提示；抽象詞使用分類圖示。已保存錄音 ${data.readyCount} / ${data.words.length} 筆。個別複合詞為組合真人錄音，已在字卡標示。</div><div class="toolbar"><input id="catalog-search" aria-label="搜尋內建字庫" placeholder="搜尋英文、中文或別名，例如 apple、蘋果" value="${esc(catalogQuery)}"><select id="catalog-category" aria-label="字庫主題"><option value="">所有主題</option>${categories.map(x=>`<option ${x===catalogCategory?'selected':''}>${esc(x)}</option>`).join('')}</select><button onclick="openEditor()">＋ 自訂字卡</button></div><div id="catalog-summary" aria-live="polite"></div><div id="catalog-list" class="cards"></div><div id="catalog-pagination" class="row" style="margin-top:24px"></div><p style="font-size:12px">字詞依教育部 107 年發布之英語文課綱附錄五表一整理，括號別名另列。中文為學習用釋義，非教育部官方翻譯。<a href="sources.html" target="_blank">查看來源及授權</a></p>`;document.getElementById('catalog-search').oninput=e=>{catalogQuery=e.target.value;catalogPage=0;catalogList()};document.getElementById('catalog-category').onchange=e=>{catalogCategory=e.target.value;catalogPage=0;catalogList()};catalogList()}catch{app.innerHTML='<div class="panel"><h2>字庫暫時無法載入</h2><button onclick="renderCatalog()">再試一次</button></div>'}}
function catalogList(){const q=catalogQuery.trim().toLowerCase();const words=catalogData.words.filter(x=>(!catalogCategory||x.category===catalogCategory)&&(!q||[x.word,x.zh,...x.aliases].join(' ').toLowerCase().includes(q)));const size=30,pages=Math.max(1,Math.ceil(words.length/size));catalogPage=Math.min(catalogPage,pages-1);document.getElementById('catalog-summary').textContent=`找到 ${words.length} 筆 · 第 ${catalogPage+1} / ${pages} 頁`;document.getElementById('catalog-list').innerHTML=words.slice(catalogPage*size,(catalogPage+1)*size).map(x=>{const added=db.cards.some(c=>c.word===x.word);return `<article class="panel mini"><div class="icon">${esc(x.emoji)}</div><span class="tag">${esc(x.category)}</span><strong style="margin-top:10px">${esc(x.word)}</strong>${x.aliases.length?`<small>${esc(x.aliases.join(' / '))}</small>`:''}<p style="min-height:70px">${zhText(x.zh)}</p><small title="${esc(x.audioNote)}">${x.audioReady?(x.audioMode==='composite'?'🎧 已保存組合真人錄音':'🎧 已保存真人錄音'):'💬 尚無保存的真人錄音'}</small><div style="margin-top:12px"><button data-preview="${x.id}">🔊 試聽</button><button class="${added?'':'primary'}" data-add="${x.id}" ${added?'disabled':''}>${added?'✓ 已加入':'＋ 加入練習'}</button><button data-customize="${x.id}">編輯後加入</button></div></article>`}).join('')||'<div class="panel"><p>找不到這個單字，也可以自訂字卡。</p></div>';document.getElementById('catalog-pagination').innerHTML=`<button onclick="catalogPage--;catalogList()" ${catalogPage===0?'disabled':''}>← 上一頁</button><span style="padding:12px">${catalogPage+1} / ${pages}</span><button onclick="catalogPage++;catalogList()" ${catalogPage>=pages-1?'disabled':''}>下一頁 →</button>`;document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>speak(catalogData.words.find(x=>x.id===b.dataset.preview).word));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addCatalogCard(b.dataset.add));document.querySelectorAll('[data-customize]').forEach(b=>b.onclick=()=>{openEditor();fillFromCatalog(catalogData.words.find(x=>x.id===b.dataset.customize))})}
function addCatalogCard(id){const x=catalogData.words.find(x=>x.id===id);if(!x||db.cards.some(c=>c.word===x.word))return;db.cards.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),catalogId:x.id,word:x.word,zh:x.zh,emoji:x.emoji,image:'',due:0,interval:0,reps:0});if(save()){catalogList();audioStatus(`✓ ${x.word} 已加入練習，圖示和發音會自動帶入。`)}}
function fillFromCatalog(x){for(const key of ['word','zh','emoji'])document.getElementById(key).value=x[key];updateMeaningPreview();document.getElementById('word-suggestions').replaceChildren();document.getElementById('formerror').textContent=x.audioReady?'✓ 已帶入字庫資料與保存的真人錄音。':'✓ 已帶入字庫資料。這個字目前尚無保存的真人錄音。'}
document.getElementById('word').addEventListener('input',async e=>{const q=e.target.value.trim().toLowerCase();const holder=document.getElementById('word-suggestions');holder.replaceChildren();if(!q||editId)return;try{const data=await loadCatalog();if(document.getElementById('word').value.trim().toLowerCase()!==q)return;const exact=data.words.filter(x=>x.word.toLowerCase()===q);const matches=[...exact,...data.words.filter(x=>x.word.toLowerCase()!==q&&(x.word.toLowerCase().startsWith(q)||x.aliases.some(a=>a.toLowerCase().startsWith(q))))].slice(0,6);for(const x of matches){const b=document.createElement('button');b.type='button';b.style.cssText='display:block;width:100%;text-align:left;border-bottom:1px solid #e5eadb;padding:10px';b.innerHTML=`${esc(x.emoji)} ${esc(x.word)} · ${zhText(x.zh)}`;b.onclick=()=>fillFromCatalog(x);holder.appendChild(b)}}catch{}});
function backup(){let url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='word-garden-backup.json';a.click();URL.revokeObjectURL(url)}document.getElementById('importer').onchange=async e=>{try{let file=e.target.files[0];if(!file)return;if(file.size>10000000)throw Error();let data=JSON.parse(await file.text());if(!Array.isArray(data.cards)||!data.cards.every(c=>typeof c.word==='string'&&validWord(c.word)&&typeof c.zh==='string'&&(!c.image||/^https:\/\//.test(c.image)||/^\/user-images\/[a-f0-9]{64}$/.test(c.image)||/^data:image\/(png|jpeg|webp|gif);base64,/.test(c.image))))throw Error();let n=0;for(let c of data.cards){if(db.cards.some(x=>x.word===c.word))continue;db.cards.push({id:(Date.now().toString(36)+Math.random().toString(36).slice(2)),word:c.word,zh:c.zh.slice(0,100),emoji:String(c.emoji||'🌱').slice(0,12),image:c.image||'',due:Number.isFinite(c.due)?c.due:0,interval:Number.isFinite(c.interval)?c.interval:0,reps:Number.isFinite(c.reps)?c.reps:0});n++}if(save()){alert(`匯入了 ${n} 張新字卡，重複單字已略過。`);renderCards()}}catch{alert('無法匯入，請選擇本站匯出的 JSON 備份。')}e.target.value=''};
/* SYNC_CLIENT */
/* ZHUYIN_CLIENT */
bootstrapCloud();
</script></html>
