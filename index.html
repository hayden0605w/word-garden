function spellingAid(word){const key=String(word||'').trim().toLowerCase();if(PHONICS_DATA[key])return PHONICS_DATA[key];const parts=/[ -]/.test(word)?String(word).split(/([ -])/).filter(Boolean):Array.from(String(word));return {parts,focus:[],kind:'spelling',note:word.includes('.')?'這是縮寫拼法；請連同句點一起記，再跟著整字發音練習。':'先看清楚字母順序，分小塊記拼法，再跟著整字錄音練習；這裡不硬套拼讀規則。'}}
function highlightSpelling(part,focus){const tokens=focus.filter(Boolean).slice().sort((a,b)=>b.length-a.length);let html='',i=0;while(i<part.length){const token=tokens.find(t=>part.slice(i,i+t.length).toLowerCase()===t.toLowerCase());if(token){html+='<mark>'+esc(part.slice(i,i+token.length))+'</mark>';i+=token.length}else{html+=esc(part[i]===' '?'␣':part[i]);i++}}return html}
function phonicsHtml(word){const aid=spellingAid(word);return `<aside class="phonics-help" id="phonics-help"><h3>${aid.kind==='spelling'?'🧩 拼寫小提示':'🧩 拼讀小提示'}</h3><div class="phonics-parts" aria-label="正確拼寫的分組">${aid.parts.map(part=>`<span>${highlightSpelling(part,aid.focus)}</span>`).join('<i aria-hidden="true">·</i>')}</div><p>${zhText(aid.note)}</p></aside>`}
function showPhonics(button){if(!checked||!current||document.getElementById('phonics-help'))return;document.getElementById('feedback').insertAdjacentHTML('beforeend',phonicsHtml(current.word));if(button){button.disabled=true;button.textContent='已顯示拼讀提示'}}

function reviewedEntry(word){word=String(word||'').trim();return CARD_REVIEW[word]||CARD_REVIEW[word.toLowerCase()]||REVIEW_LOWER.get(word.toLowerCase())}
function cardMeaning(card){const review=reviewedEntry(card.word);return review&&(!card.zh||card.zh===review.originalZh)?review.zh:card.zh}
function reviewSVG(content){return `<svg class="concept-illustration" viewBox="0 0 280 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><rect x="6" y="6" width="268" height="168" rx="22" fill="#f2f5e8"/>${content}</svg>`}
function numericArt(type,value){if(type==='number'){const n=Number(value),dots=n<=10?Array.from({length:n},(_,i)=>`<circle cx="${100+(i%5)*20}" cy="${126+Math.floor(i/5)*18}" r="6" fill="#dc8469"/>`).join(''):'';return reviewSVG(`<text x="140" y="${n<=10?96:116}" text-anchor="middle" fill="#285c45" font-size="${n>=1000000?44:66}" font-weight="700">${n.toLocaleString('zh-TW')}</text>${dots}`)}if(type==='ordinal')return reviewSVG([1,2,3].map((n,i)=>`<rect x="${32+i*76}" y="55" width="64" height="73" rx="12" fill="${n===Number(value)?'#285c45':'#dfe7d3'}"/><text x="${64+i*76}" y="103" text-anchor="middle" font-size="37" font-weight="700" fill="${n===Number(value)?'#fffdf6':'#89957c'}">${n}</text>`).join(''));if(type==='fraction'){const half=value==='2';return reviewSVG(`<circle cx="140" cy="90" r="58" fill="#dfe7d3"/><path d="M140 90V32A58 58 0 ${half?'0 1 140 148':'0 1 198 90'}Z" fill="#dc8469"/><path d="M140 32v116${half?'':'M82 90h116'}" stroke="#fffdf6" stroke-width="4"/>`)}return ''}
function calendarArt(type,value){const n=Number(value);if(type==='month')return reviewSVG(`<rect x="69" y="24" width="142" height="132" rx="13" fill="#fffdf6" stroke="#c7d5b8" stroke-width="3"/><path d="M70 55h140" stroke="#285c45" stroke-width="27"/><text x="140" y="118" text-anchor="middle" fill="#285c45" font-size="48" font-weight="700">${n}</text><path d="M98 20v19m84-19v19" stroke="#91a780" stroke-width="7" stroke-linecap="round"/>`);return reviewSVG(`${['1','2','3','4','5','6','7'].map((label,i)=>`<rect x="${17+i*35}" y="75" width="31" height="44" rx="8" fill="${i+1===n?'#285c45':'#dfe7d3'}"/><text x="${32.5+i*35}" y="105" text-anchor="middle" font-size="21" fill="${i+1===n?'#fffdf6':'#819074'}">${label}</text>`).join('')}`)}
function reviewedArt(card){const review=reviewedEntry(card.word);if(!review)return '';if(card.emoji&&card.emoji!==review.originalEmoji)return '';const complete=unifiedSceneArt(card.word);if(complete)return complete;let visual='';if(review.symbol.startsWith('@')){const [type,value]=review.symbol.slice(1).split(':');visual=type==='object'?objectArt(value):type==='color'?reviewSVG(`<circle cx="140" cy="90" r="55" fill="${esc(value)}" stroke="#b8c4af" stroke-width="3"/>`):type==='spatial'?spatialArt(card.word):['number','ordinal','fraction'].includes(type)?numericArt(type,value):calendarArt(type,value)}else visual=`<span class="review-symbol" style="--symbol-count:${visualSymbolCount(review.symbol)}" aria-hidden="true">${esc(review.symbol)}</span>`;return visual}

function practice(){app.innerHTML=`<div class="practice practice-session"><div class="row" style="justify-content:space-between"><button onclick="go('home')">← 回花園</button><span>本回合 ${done+1} / ${total}</span></div><div class="progress"><i style="width:${done/total*100}%"></i></div><section class="panel study-grid"><div class="study-prompt"><span class="eyebrow">LISTEN · THINK · SPELL</span><h2>這個單字怎麼拼？</h2><button type="button" class="picture pronounce-target" onclick="speak(current.word)" aria-label="點圖片聽單字發音">${art(current)}</button><button type="button" class="meaning pronounce-target" onclick="speak(current.word)" aria-label="點中文聽單字發音">${zhText(cardMeaning(current))}</button><div class="row"><button type="button" class="listen-button" onclick="speak(current.word)">🔊 聽發音</button></div></div><form id="answerform" class="study-entry"><div class="study-controls"><span id="keyboard-label"></span><button type="button" id="keyboard-mode" class="keyboard-mode" onclick="setKeyboardMode()"></button></div><input id="answer" class="spell" aria-label="輸入英文單字" maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在這裡拼字"><div id="letters" class="letters"></div><div id="feedback" aria-live="polite"></div><div id="actions" class="row"><button type="button" onclick="hint()">💡 看提示</button><button class="primary">檢查答案 ✓</button></div>${keyboardMarkup()}</form></section><p class="study-instruction">先試著自己拼字，需要幫忙時按「看提示」。也可以直接用實體鍵盤輸入。</p></div>`;document.getElementById('answerform').onsubmit=e=>{e.preventDefault();check()};document.querySelectorAll('[data-key]').forEach(button=>{button.onpointerdown=e=>e.preventDefault();button.onclick=()=>enterGardenKey(button.dataset.key)});applyKeyboardMode();focusAnswer()}
document.addEventListener('keydown',event=>{if(page!=='study'||!builtInKeyboard()||checked||event.ctrlKey||event.metaKey||event.altKey||event.isComposing||document.querySelector('dialog[open]'))return;const input=document.getElementById('answer');if(!input||event.target!==input)return;const key=event.key;if(/^[a-zA-Z .'-]$/.test(key)||key==='Backspace'||key==='Enter'){event.preventDefault();enterGardenKey(key==='Backspace'?'backspace':key==='Enter'?'enter':key.toLowerCase())}});
function showLetterHints(){let letters=[...new Set(current.word.split(''))].sort(()=>Math.random()-.5);document.getElementById('letters').innerHTML=letters.map(l=>`<button type="button" data-letter="${esc(l)}">${esc(l===' '?'␣':l)}</button>`).join('');document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{document.getElementById('answer').value+=b.dataset.letter;focusAnswer()})}function hint(){if(checked)return;if(!revealed){revealed=true;showLetterHints()}document.getElementById('feedback').innerHTML=`<div class="feedback">第一個字母是 <b>${esc(current.word[0])}</b>，共有 ${current.word.replace(/ /g,'').length} 個字母。<br>試著聽一次，再拼拼看！</div>`}function check(){if(checked)return;let val=document.getElementById('answer').value.trim().toLowerCase();if(!val)return;checked=true;document.querySelectorAll('[data-key]').forEach(button=>button.disabled=true);document.getElementById('keyboard-mode').disabled=true;let right=val===current.word.toLowerCase();document.getElementById('answer').disabled=true;document.getElementById('letters').innerHTML='';document.getElementById('feedback').innerHTML=`<div class="feedback">${right?'<span class="answer-mascot" aria-hidden="true">🐰🌟</span> 拼對了，做得好！':'🌱 沒關係，再看一次就更熟悉。'}<br><button type="button" class="answer-word" onclick="speak(current.word)" aria-label="再聽一次單字發音">${esc(current.word)}</button><br>${zhText(cardMeaning(current))}</div>`;document.getElementById('actions').innerHTML=right?`<button type="button" onclick="rate(1)">有點難</button><button type="button" class="primary" onclick="rate(${revealed?1:2})">${revealed?'提示後想起來了':'我記住了！'} →</button>`:`<button type="button" onclick="speak(current.word)">🔊 再聽一次</button><button type="button" class="primary" onclick="rate(0)">等一下再練一次 →</button>`;if(right)document.getElementById('actions').insertAdjacentHTML('beforeend','<button type="button" onclick="showPhonics(this)">看拼讀提示</button>');else document.getElementById('feedback').insertAdjacentHTML('beforeend',phonicsHtml(current.word));speak(current.word)}
function rate(grade){if(!checked)return;if(!db.cards.some(c=>c.id===current.id)){audioStatus('這張卡已在另一個裝置刪除。');next();return}checked=false;let mins=60000;if(grade===0){current.interval=0;current.due=Date.now()+10*mins;if(queue.length<8){queue.push(current.id);total++}}else{current.reps++;current.interval=grade===1?1:current.interval?Math.max(3,Math.round(current.interval*2.3)):1;current.due=Date.now()+current.interval*86400000}db.history[day()]=(db.history[day()]||0)+1;save();done++;next()}
function renderCards(q=''){app.innerHTML=`<div class="eyebrow">YOUR WORD COLLECTION</div><h1>字卡收藏</h1><p>每個新單字，都是一顆小種子。可以持續新增，也可以備份帶走。</p><div class="toolbar"><input id="search" placeholder="搜尋英文或中文" aria-label="搜尋字卡" value="${esc(q)}"><button class="primary" onclick="go('catalog')">📚 從內建字庫加入</button><button onclick="openEditor()">＋ 自訂字卡</button><button onclick="backup()">匯出備份</button><button onclick="document.getElementById('importer').click()">匯入備份</button></div><p style="font-size:12px">複習安排：不熟 → 10 分鐘；有點難 → 1 天；記住了 → 1 天、3 天、約 7 天，之後逐步拉長。答錯會在本回合再練。</p><div id="cardlist" class="cards"></div>`;document.getElementById('search').oninput=e=>list(e.target.value);list(q)}function list(q){let cards=db.cards.filter(c=>(c.word+cardMeaning(c)).toLowerCase().includes(q.toLowerCase()));document.getElementById('cardlist').innerHTML=cards.length?cards.map(c=>`<div class="panel mini"><button type="button" class="icon card-audio-image" data-speak="${c.id}" aria-label="播放 ${esc(c.word)} 的發音">${art(c)}</button><button type="button" class="card-audio-word" data-speak="${c.id}">${esc(c.word)}</button><p>${zhText(cardMeaning(c))}</p><small>${!c.reps?'新朋友':c.due<=Date.now()?'可以複習了':`下次：${new Date(c.due).toLocaleDateString('zh-TW')}`}</small><div style="margin-top:12px"><button data-speak="${c.id}">🔊 發音</button><button data-edit="${c.id}">編輯</button><button data-delete="${c.id}" aria-label="刪除 ${esc(c.word)}">×</button></div></div>`).join(''):'<p>還找不到這個單字，新增一張吧！</p>';document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(db.cards.find(c=>c.id===b.dataset.speak).word));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('確定刪除這張字卡和它的學習進度？')){db.cards=db.cards.filter(c=>c.id!==b.dataset.delete);save();list(q)}})}
function openEditor(id){editId=id||null;let c=db.cards.find(c=>c.id===id);document.getElementById('cardform').reset();for(let k of ['word','zh','emoji','image'])document.getElementById(k).value=(k==='zh'&&c?cardMeaning(c):c?.[k])||(k==='emoji'?'🌱':'');document.getElementById('dialogtitle').textContent=c?'編輯單字':'種下一個新單字 🌱';document.getElementById('formerror').textContent='';document.getElementById('word-suggestions').replaceChildren();updateMeaningPreview();document.getElementById('editor').showModal();loadCatalog().catch(()=>{})}
document.getElementById('cardform').onsubmit=async e=>{e.preventDefault();let word=document.getElementById('word').value.trim(),zh=document.getElementById('zh').value.trim(),emoji=document.getElementById('emoji').value.trim(),image=document.getElementById('image').value.trim(),file=document.getElementById('photo').files[0];if(!word||!zh)return;if(!validWord(word)){document.getElementById('formerror').textContent='請使用英文字母、空格、句點、撇號或連字號。';return}if(db.cards.some(c=>c.word===word&&c.id!==editId)){document.getElementById('formerror').textContent='這個單字已經在花園裡囉！';return}if(image&&!image.startsWith('https://')){document.getElementById('formerror').textContent='圖片請使用 https 網址。';return}if(file){if(file.size>1048576){document.getElementById('formerror').textContent='請選擇小於 1 MB 的圖片。';return}image=await new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(file)})}let c=db.cards.find(c=>c.id===editId);if(c){Object.assign(c,{word,zh,emoji,image})}else db.cards.push({id:(Date.now().toString(36)+Math.random().toString(36).slice(2)),word,zh,emoji,image,due:0,interval:0,reps:0});if(save()){document.getElementById('editor').close();page='cards';renderCards();prepareRecording(word)}};
async function prepareRecording(word){audioStatus('字卡已儲存，正在確認內建錄音…');try{await lookupAudio(word);audioStatus('✓ 已帶入內建錄音。')}catch{audioStatus('字卡已儲存；這個字沒有內建錄音，會使用裝置語音。')}}

let catalogData=null,catalogPromise=null,catalogPage=0,catalogQuery='',catalogCategory='';
function validWord(word){return /^[A-Za-z][A-Za-z .'-]{0,59}$/.test(word)}
async function loadCatalog(){if(catalogData)return catalogData;if(!catalogPromise)catalogPromise=fetch(new URL('assets/catalog.json',document.baseURI)).then(r=>{if(!r.ok)throw Error('字庫暫時無法載入');return r.json()}).then(data=>{for(const word of data.words){const review=reviewedEntry(word.word);if(review)word.zh=review.zh;if(spatialScenes[word.word.toLowerCase()])word.category='方位與位置';}catalogData=data;return data}).catch(e=>{catalogPromise=null;throw e});return catalogPromise}
async function renderCatalog(){app.innerHTML='<div class="panel"><h1>📚 內建單字圖書館</h1><p role="status">正在打開字庫…</p></div>';try{const data=await loadCatalog();if(page!=='catalog')return;const categories=[...new Set(data.words.map(x=>x.category))];app.innerHTML=`<div class="eyebrow">PICK A WORD · PLANT A MEMORY</div><h1>內建單字圖書館</h1><p>教育部基本 1,200 字 · 原表共 ${data.words.length.toLocaleString()} 筆條目<br>每個字已整理中文與圖像提示，選喜歡的加入自己的練習。</p><div class="panel" style="padding:18px;background:#eaf0dd;font-size:13px">🌱 一次選幾個就好，加入後才會排入複習。<br>字卡保留圖像與中文注音；答錯後顯示拼讀或拼寫小提示，幫助記住字母順序。已保存錄音 ${data.readyCount} / ${data.words.length} 筆。個別複合詞為組合真人錄音，已在字卡標示。</div><div class="toolbar"><input id="catalog-search" aria-label="搜尋內建字庫" placeholder="搜尋英文、中文或別名，例如 apple、蘋果" value="${esc(catalogQuery)}"><select id="catalog-category" aria-label="字庫主題"><option value="">所有主題</option>${categories.map(x=>`<option ${x===catalogCategory?'selected':''}>${esc(x)}</option>`).join('')}</select><button onclick="openEditor()">＋ 自訂字卡</button></div><div id="catalog-summary" aria-live="polite"></div><div id="catalog-list" class="cards"></div><div id="catalog-pagination" class="row" style="margin-top:24px"></div><p style="font-size:12px">字詞依教育部 107 年發布之英語文課綱附錄五表一整理，括號別名另列。中文為學習用釋義，非教育部官方翻譯。<a href="sources.html" target="_blank">查看來源及授權</a></p>`;document.getElementById('catalog-search').oninput=e=>{catalogQuery=e.target.value;catalogPage=0;catalogList()};document.getElementById('catalog-category').onchange=e=>{catalogCategory=e.target.value;catalogPage=0;catalogList()};catalogList()}catch{app.innerHTML='<div class="panel"><h2>字庫暫時無法載入</h2><button onclick="renderCatalog()">再試一次</button></div>'}}
function catalogList(){const q=catalogQuery.trim().toLowerCase();const words=catalogData.words.filter(x=>(!catalogCategory||x.category===catalogCategory)&&(!q||[x.word,x.zh,...x.aliases].join(' ').toLowerCase().includes(q)));const size=30,pages=Math.max(1,Math.ceil(words.length/size));catalogPage=Math.min(catalogPage,pages-1);document.getElementById('catalog-summary').textContent=`找到 ${words.length} 筆 · 第 ${catalogPage+1} / ${pages} 頁`;document.getElementById('catalog-list').innerHTML=words.slice(catalogPage*size,(catalogPage+1)*size).map(x=>{const added=db.cards.some(c=>c.word===x.word);return `<article class="panel mini"><button type="button" class="icon card-audio-image" data-preview="${x.id}" aria-label="播放 ${esc(x.word)} 的發音">${art(x)}</button><span class="tag">${esc(x.category)}</span><button type="button" class="card-audio-word" style="margin-top:10px" data-preview="${x.id}">${esc(x.word)}</button>${x.aliases.length?`<small>${esc(x.aliases.join(' / '))}</small>`:''}<p style="min-height:70px">${zhText(x.zh)}</p><small title="${esc(x.audioNote)}">${x.audioReady?(x.audioMode==='composite'?'🎧 已保存組合真人錄音':'🎧 已保存真人錄音'):'💬 尚無保存的真人錄音'}</small><div style="margin-top:12px"><button data-preview="${x.id}">🔊 試聽</button><button class="${added?'':'primary'}" data-add="${x.id}" ${added?'disabled':''}>${added?'✓ 已加入':'＋ 加入練習'}</button><button data-customize="${x.id}">編輯後加入</button></div></article>`}).join('')||'<div class="panel"><p>找不到這個單字，也可以自訂字卡。</p></div>';document.getElementById('catalog-pagination').innerHTML=`<button onclick="catalogPage--;catalogList()" ${catalogPage===0?'disabled':''}>← 上一頁</button><span style="padding:12px">${catalogPage+1} / ${pages}</span><button onclick="catalogPage++;catalogList()" ${catalogPage>=pages-1?'disabled':''}>下一頁 →</button>`;document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>speak(catalogData.words.find(x=>x.id===b.dataset.preview).word));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addCatalogCard(b.dataset.add));document.querySelectorAll('[data-customize]').forEach(b=>b.onclick=()=>{openEditor();fillFromCatalog(catalogData.words.find(x=>x.id===b.dataset.customize))})}
function addCatalogCard(id){const x=catalogData.words.find(x=>x.id===id);if(!x||db.cards.some(c=>c.word===x.word))return;db.cards.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),catalogId:x.id,word:x.word,zh:x.zh,emoji:x.emoji,image:'',due:0,interval:0,reps:0});if(save()){catalogList();audioStatus(`✓ ${x.word} 已加入練習，圖示和發音會自動帶入。`)}}
function fillFromCatalog(x){for(const key of ['word','zh','emoji'])document.getElementById(key).value=x[key];updateMeaningPreview();document.getElementById('word-suggestions').replaceChildren();document.getElementById('formerror').textContent=x.audioReady?'✓ 已帶入字庫資料與保存的真人錄音。':'✓ 已帶入字庫資料。這個字目前尚無保存的真人錄音。'}
document.getElementById('word').addEventListener('input',async e=>{const q=e.target.value.trim().toLowerCase();const holder=document.getElementById('word-suggestions');holder.replaceChildren();if(!q||editId)return;try{const data=await loadCatalog();if(document.getElementById('word').value.trim().toLowerCase()!==q)return;const exact=data.words.filter(x=>x.word.toLowerCase()===q);const matches=[...exact,...data.words.filter(x=>x.word.toLowerCase()!==q&&(x.word.toLowerCase().startsWith(q)||x.aliases.some(a=>a.toLowerCase().startsWith(q))))].slice(0,6);for(const x of matches){const b=document.createElement('button');b.type='button';b.style.cssText='display:block;width:100%;text-align:left;border-bottom:1px solid #e5eadb;padding:10px';b.innerHTML=`${esc(x.emoji)} ${esc(x.word)} · ${zhText(x.zh)}`;b.onclick=()=>fillFromCatalog(x);holder.appendChild(b)}}catch{}});
